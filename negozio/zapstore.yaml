name: Barattolo Negozio
summary: La cassa in satoshi per chi vende di persona
description: |
  La cassa di Barattolo per negozi, banchi ed eventi. Tocchi gli
  articoli della tua vetrina e incassi con un QR Lightning o on-chain
  che chi compra inquadra con qualsiasi wallet, senza account. I sats
  vanno dritti al tuo wallet, senza deposito di garanzia e senza
  commissioni; le vendite restano negli «Ordini» di Barattolo, con lo
  stesso account. L'app è un involucro leggero di https://barattolo.store

